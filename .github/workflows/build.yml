name: Build clients

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: '构建哪个平台（android/ios/web/all），默认只打安卓'
        required: false
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - web
          - all

jobs:
  android:
    # push 默认只打安卓（最快）；手动可选 all 全打；ios/web 只在手动指定时跑
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze || true
      - run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos 2>/dev/null || cd build/ios
          mkdir -p Payload
          cp -r Runner.app Payload/ 2>/dev/null || true
          zip -r app-unsigned.ipa Payload 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/**/app-unsigned.ipa

  web:
    if: inputs.platform == 'web' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
