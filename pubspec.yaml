name: bloodsugar_v5
description: 动态血糖仪跨平台 App - 多品牌直连 + OPPO Watch + 免费糖友社区
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # BLE
  flutter_blue_plus: ^1.33.0

  # 后端 (Supabase 免费)
  supabase_flutter: ^2.5.0

  # 数据库
  sqflite: ^2.3.0
  path_provider: ^2.1.2

  # 状态管理
  riverpod: ^2.5.0
  riverpod_annotation: ^2.4.0

  # UI
  fluentui_system_icons: ^1.1.221
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # 工具
  intl: ^0.19.0
  uuid: ^4.3.0
  permission_handler: ^11.3.0
  flutter_foreground_task: ^9.1.0
  flutter_overlay_window: ^0.5.0
  http: ^1.2.1
  crypto: ^3.0.3
  url_launcher: ^6.2.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.1.0
  health: ^13.3.1
  share_plus: ^12.0.2
  device_info_plus: ^12.4.0
  pedometer: ^4.2.0
  home_widget: ^0.10.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0

flutter:
  uses-material-design: true
